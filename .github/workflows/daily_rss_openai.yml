name: Daily RSS OpenAI Digest

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Max enabled sources to scan"
        required: false
        default: "72"
      feeds_per_source:
        description: "Feeds per source to scan"
        required: false
        default: "1"
      max_items_per_feed:
        description: "RSS items per feed (increase for older coverage)"
        required: false
        default: "3"
      skip_seen:
        description: "Skip links/titles already present in current + history"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      source_ids:
        description: "Optional comma-separated source IDs (blank = all enabled)"
        required: false
        default: ""
      run_scoring:
        description: "Run rubric scoring + downstream analysis"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      score_max_items:
        description: "Max unscored items to score from digest+history (0 = all pending)"
        required: false
        default: "8"
      force_rescore:
        description: "Force full rescore for selected subset and replace existing scores output"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
permissions:
  contents: write

concurrency:
  group: daily-rss-openai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-rss-openai:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      QUALITY_MAX_UNKNOWN_CONTENT_TYPES: "0"
      QUALITY_MAX_UNSUPPORTED_CONTENT_TYPES: "0"
      QUALITY_MAX_ACCEPTED_CONTENT_TYPE_FILTERS: "60"
      QUALITY_MAX_SOURCE_BLOCKED: "2"
      QUALITY_MAX_ACCEPTED_RSS_ONLY_FALLBACK: "0"
      QUALITY_MAX_LLM_REVIEW_ITEMS: "2"
      QUALITY_MAX_EMPTY_SCRAPED_TEXT: "0"
      QUALITY_MAX_SHORT_SCRAPED_TEXT: "2"
      FEED_AUDIT_MAX_SOURCES: "72"
      FEED_AUDIT_FEEDS_PER_SOURCE: "2"
      FEED_AUDIT_MAX_ITEMS_PER_FEED: "5"
      FEED_AUDIT_MAX_FEED_FETCH_FAILURES: "0"
      FEED_AUDIT_MAX_MISSING_RSS_CONTENT: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore OpenAI cache DB
        id: openai_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-openai-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openai-cache-${{ github.ref_name }}-
            ${{ runner.os }}-openai-cache-main-

      - name: Restore scoring artifacts
        id: score_artifacts_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/scores.json
          key: ${{ runner.os }}-rss-score-artifacts-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rss-score-artifacts-${{ github.ref_name }}-
            ${{ runner.os }}-rss-score-artifacts-main-

      - name: Show cache restore details
        run: |
          echo "Cache primary key: ${{ steps.openai_cache_restore.outputs.cache-primary-key }}"
          echo "Cache matched key: ${{ steps.openai_cache_restore.outputs.cache-matched-key }}"
          echo "Cache exact hit: ${{ steps.openai_cache_restore.outputs.cache-hit }}"
          echo "Score cache primary key: ${{ steps.score_artifacts_restore.outputs.cache-primary-key }}"
          echo "Score cache matched key: ${{ steps.score_artifacts_restore.outputs.cache-matched-key }}"
          echo "Score cache exact hit: ${{ steps.score_artifacts_restore.outputs.cache-hit }}"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run RSS OpenAI digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MAX_SOURCES: ${{ github.event.inputs.max_sources || '' }}
          INPUT_FEEDS_PER_SOURCE: ${{ github.event.inputs.feeds_per_source || '' }}
          INPUT_MAX_ITEMS_PER_FEED: ${{ github.event.inputs.max_items_per_feed || '' }}
          INPUT_SKIP_SEEN: ${{ github.event.inputs.skip_seen || '' }}
          SOURCE_IDS: ${{ github.event.inputs.source_ids || '' }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_MAX_SOURCES}" ]; then
            MAX_SOURCES="${INPUT_MAX_SOURCES}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            MAX_SOURCES="72"
          else
            MAX_SOURCES="72"
          fi

          if [ -n "${INPUT_FEEDS_PER_SOURCE}" ]; then
            FEEDS_PER_SOURCE="${INPUT_FEEDS_PER_SOURCE}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            FEEDS_PER_SOURCE="1"
          else
            FEEDS_PER_SOURCE="1"
          fi

          if [ -n "${INPUT_MAX_ITEMS_PER_FEED}" ]; then
            MAX_ITEMS_PER_FEED="${INPUT_MAX_ITEMS_PER_FEED}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            MAX_ITEMS_PER_FEED="3"
          else
            MAX_ITEMS_PER_FEED="3"
          fi

          if [ -n "${INPUT_SKIP_SEEN}" ]; then
            SKIP_SEEN="${INPUT_SKIP_SEEN}"
          else
            SKIP_SEEN="true"
          fi

          echo "Digest build params: max_sources=${MAX_SOURCES}, feeds_per_source=${FEEDS_PER_SOURCE}, max_items_per_feed=${MAX_ITEMS_PER_FEED}, skip_seen=${SKIP_SEEN}, source_ids=${SOURCE_IDS:-<all>}"

          digest_cmd=(python3 -m rss_pipeline.cli digest build \
            --output data/rss_openai_daily.json \
            --max-sources "${MAX_SOURCES}" \
            --feeds-per-source "${FEEDS_PER_SOURCE}" \
            --max-items-per-feed "${MAX_ITEMS_PER_FEED}" \
            --scrape-timeout-seconds 12 \
            --scrape-sleep-seconds 0.25 \
            --openai-timeout 180 \
            --openai-batch-size 8 \
            --openai-max-retries 2 \
            --openai-retry-backoff-seconds 5 \
            --cache-path data/cache/openai_cache.sqlite \
            --prompt-audit-dir data/analysis/prompt_audit)

          if [ "${SKIP_SEEN}" = "true" ]; then
            digest_cmd+=(--skip-seen)
          else
            digest_cmd+=(--no-skip-seen)
          fi

          if [ -n "${SOURCE_IDS}" ]; then
            digest_cmd+=(--source-ids "${SOURCE_IDS}")
          fi

          "${digest_cmd[@]}"

      - name: Inspect digest item count
        id: digest_meta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          payload = json.loads(Path("data/rss_openai_daily.json").read_text(encoding="utf-8"))
          items = payload.get("items") if isinstance(payload, dict) else []
          count = len(items) if isinstance(items, list) else 0
          print(f"Digest items: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"items={count}\n")
          PY

      - name: Print digest audit summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          digest_path = Path("data/rss_openai_daily.json")
          if not digest_path.exists():
              print("Digest file missing; no audit summary available.")
              raise SystemExit(0)

          payload = json.loads(digest_path.read_text(encoding="utf-8"))
          audit = payload.get("audit") if isinstance(payload, dict) else {}
          summary = audit.get("summary") if isinstance(audit, dict) else {}
          warnings = audit.get("warnings") if isinstance(audit, dict) else []

          print("Digest audit summary:")
          for key in (
              "selected_sources",
              "selected_feeds",
              "raw_fetched_items",
              "in_run_duplicates",
              "skipped_seen",
              "new_items",
              "new_items_before_scrape",
              "accepted_content_type_filter",
              "scrape_attempts",
              "scrape_success",
              "scrape_failed",
              "scrape_accepted_fallback",
              "scrape_skipped",
              "openai_batches_executed",
              "openai_batches_succeeded",
              "openai_batches_failed",
              "openai_retry_attempts",
          ):
              print(f"  {key}: {summary.get(key)}")

          if isinstance(warnings, list) and warnings:
              print("Warnings:")
              for warning in warnings:
                  print(f"  - {warning}")
          else:
              print("Warnings: none")
          PY

      - name: Validate digest quality gate
        run: |
          python3 -m rss_pipeline.cli validate quality \
            --digest data/rss_openai_daily.json \
            --output data/analysis/quality/rss_digest_quality_review.json \
            --archive-history-dir data/analysis/quality/history \
            --max-unknown-content-types "${QUALITY_MAX_UNKNOWN_CONTENT_TYPES}" \
            --max-unsupported-content-types "${QUALITY_MAX_UNSUPPORTED_CONTENT_TYPES}" \
            --max-accepted-content-type-filters "${QUALITY_MAX_ACCEPTED_CONTENT_TYPE_FILTERS}" \
            --max-source-blocked "${QUALITY_MAX_SOURCE_BLOCKED}" \
            --max-accepted-rss-only-fallback "${QUALITY_MAX_ACCEPTED_RSS_ONLY_FALLBACK}" \
            --max-llm-review-items "${QUALITY_MAX_LLM_REVIEW_ITEMS}" \
            --max-empty-scraped-text "${QUALITY_MAX_EMPTY_SCRAPED_TEXT}" \
            --max-short-scraped-text "${QUALITY_MAX_SHORT_SCRAPED_TEXT}"

      - name: Review digest quality history
        run: |
          python3 -m rss_pipeline.cli validate quality-history \
            --current data/analysis/quality/rss_digest_quality_review.json \
            --history-dir data/analysis/quality/history

      - name: Audit broader RSS feed coverage
        run: |
          python3 -m rss_pipeline.cli validate feed-audit \
            --output data/analysis/feed_audit/rss_feed_audit.json \
            --archive-history-dir data/analysis/feed_audit/history \
            --max-sources "${FEED_AUDIT_MAX_SOURCES}" \
            --feeds-per-source "${FEED_AUDIT_FEEDS_PER_SOURCE}" \
            --max-items-per-feed "${FEED_AUDIT_MAX_ITEMS_PER_FEED}" \
            --max-feed-fetch-failures "${FEED_AUDIT_MAX_FEED_FETCH_FAILURES}" \
            --max-missing-rss-content "${FEED_AUDIT_MAX_MISSING_RSS_CONTENT}" \
            --max-unknown-content-types 0 \
            --max-unsupported-content-types 0

      - name: Review feed source health trends
        run: |
          python3 -m rss_pipeline.cli validate source-health \
            --current data/analysis/feed_audit/rss_feed_audit.json \
            --history-dir data/analysis/feed_audit/history \
            --output data/analysis/feed_audit/source_health_trends.json

      - name: Upload feed audit logs
        if: always() && hashFiles('data/analysis/feed_audit/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rss-feed-audit
          path: |
            data/analysis/feed_audit/rss_feed_audit.json
            data/analysis/feed_audit/source_health_trends.json
            data/analysis/feed_audit/history/rss_feed_audit_*.json
            data/analysis/feed_audit/run_logs/*.jsonl

      - name: Prepare scoring subset
        id: score_subset
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SCORING: ${{ github.event.inputs.run_scoring || 'true' }}
          INPUT_SCORE_MAX_ITEMS: ${{ github.event.inputs.score_max_items || '' }}
          FORCE_RESCORE: ${{ github.event.inputs.force_rescore || 'false' }}
        run: |
          set -euo pipefail

          if [ "${RUN_SCORING}" != "true" ]; then
            echo "Scoring disabled for this run."
            echo "items=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${INPUT_SCORE_MAX_ITEMS}" ]; then
            SCORE_MAX_ITEMS="${INPUT_SCORE_MAX_ITEMS}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            SCORE_MAX_ITEMS="8"
          else
            SCORE_MAX_ITEMS="8"
          fi

          export SCORE_MAX_ITEMS

          python3 - <<'PY'
          import json
          import re
          from datetime import date
          import os
          from pathlib import Path

          digest_path = Path("data/rss_openai_daily.json")
          score_input_path = Path("data/rss_openai_daily_for_scoring.json")
          history_dir = Path("data/history")
          history_days = 180
          payload = json.loads(digest_path.read_text(encoding="utf-8"))
          raw_items = payload.get("items") if isinstance(payload, dict) else []
          digest_items = raw_items if isinstance(raw_items, list) else []

          history_items = []
          pattern = re.compile(r"^rss_openai_daily_(\d{4}-\d{2}-\d{2})\.json$")
          if history_dir.exists():
            today = date.today()
            history_paths = []
            for path in history_dir.glob("rss_openai_daily_*.json"):
              match = pattern.match(path.name)
              if not match:
                continue
              try:
                snapshot_day = date.fromisoformat(match.group(1))
              except ValueError:
                continue
              age_days = (today - snapshot_day).days
              if age_days < 0 or age_days > history_days:
                continue
              history_paths.append((snapshot_day, path))
            history_paths.sort(reverse=True)

            for _snapshot_day, snapshot_path in history_paths:
              try:
                snapshot_payload = json.loads(snapshot_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                continue
              snapshot_raw_items = snapshot_payload.get("items") if isinstance(snapshot_payload, dict) else []
              if isinstance(snapshot_raw_items, list):
                history_items.extend(item for item in snapshot_raw_items if isinstance(item, dict))

          items = []
          items.extend(item for item in digest_items if isinstance(item, dict))
          items.extend(history_items)

          existing_scores_path = Path("data/scores.json")
          scored_rubric_signatures_by_item_id: dict[str, set[str]] = {}

          def rubric_signature(raw_rubric: dict) -> str:
            def normalize_question(raw_question):
              if isinstance(raw_question, dict):
                return {
                  "question": str(raw_question.get("question") or "").strip(),
                  "semantic_class": str(raw_question.get("semantic_class") or "existence_good").strip(),
                }
              return {
                "question": str(raw_question or "").strip(),
                "semantic_class": "existence_good",
              }

            raw_questions = raw_rubric.get("questions")
            questions = []
            if isinstance(raw_questions, list):
              questions = [normalize_question(question) for question in raw_questions]

            try:
              expected_question_count = int(raw_rubric.get("expected_question_count", len(questions)))
            except (TypeError, ValueError):
              expected_question_count = len(questions)
            try:
              min_score = float(raw_rubric.get("min_score_per_question", 0.0))
            except (TypeError, ValueError):
              min_score = 0.0
            try:
              max_score = float(raw_rubric.get("max_score_per_question", 5.0))
            except (TypeError, ValueError):
              max_score = 5.0

            normalized_rubric = {
              "name": str(raw_rubric.get("name") or "").strip(),
              "questions": questions,
              "expected_question_count": expected_question_count,
              "min_score_per_question": min_score,
              "max_score_per_question": max_score,
            }
            return json.dumps(normalized_rubric, ensure_ascii=False, sort_keys=True)

          required_rubric_signatures: set[str] = set()
          lenses_dir = Path("lenses")
          ignored_lens_files: set[str] = set()
          ignore_file = lenses_dir / "ignore.txt"
          if ignore_file.exists():
            try:
              for line in ignore_file.read_text(encoding="utf-8").splitlines():
                normalized = line.strip()
                if not normalized or normalized.startswith("#"):
                  continue
                ignored_lens_files.add(normalized)
            except OSError:
              pass

          if lenses_dir.exists():
            for lens_path in sorted(lenses_dir.glob("*.json")):
              if lens_path.name in ignored_lens_files:
                continue
              try:
                lens_payload = json.loads(lens_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                continue
              if not isinstance(lens_payload, dict):
                continue
              raw_rubrics = lens_payload.get("rubrics")
              if not isinstance(raw_rubrics, list):
                continue
              for raw_rubric in raw_rubrics:
                if isinstance(raw_rubric, dict):
                  required_rubric_signatures.add(rubric_signature(raw_rubric))

          scored_item_ids = set()
          if existing_scores_path.exists():
            try:
              existing_scores = json.loads(existing_scores_path.read_text(encoding="utf-8"))
            except (OSError, json.JSONDecodeError):
              existing_scores = []
            if isinstance(existing_scores, list):
              for score in existing_scores:
                if not isinstance(score, dict):
                  continue
                news_item = score.get("news_item")
                if not isinstance(news_item, dict):
                  continue
                item_id = str(news_item.get("id") or "").strip()
                if item_id:
                  scored_item_ids.add(item_id)
                raw_rubric = score.get("rubric")
                if item_id and isinstance(raw_rubric, dict):
                  item_rubrics = scored_rubric_signatures_by_item_id.setdefault(item_id, set())
                  item_rubrics.add(rubric_signature(raw_rubric))

          def item_key(item: dict) -> str:
            item_id = str(item.get("id") or "").strip()
            if item_id:
              return f"id:{item_id}"
            link = str(item.get("link") or "").strip().lower()
            if link:
              return f"link:{link}"
            source = item.get("source")
            source_id = ""
            if isinstance(source, dict):
              source_id = str(source.get("id") or "").strip().lower()
            title = " ".join(str(item.get("title") or "").lower().split())
            if title:
              return f"title:{source_id}:{title}"
            return ""

          def scrape_succeeded(item: dict) -> bool:
            scrape_error = str(item.get("scrape_error") or "").strip()
            if scrape_error:
              return False

            # Current schema writes `scraped` for all items.
            # Keep legacy items eligible if this field is absent.
            if "scraped" not in item:
              return True

            scraped = item.get("scraped")
            return isinstance(scraped, dict) and bool(scraped)

          def ready_for_llm_judge(item: dict) -> bool:
            if "ready_for_llm_judge" not in item and "llm_input_status" not in item:
              return True
            return item.get("ready_for_llm_judge") is True and str(item.get("llm_input_status") or "").strip() == "ready"

          scraped_items = [item for item in items if isinstance(item, dict) and scrape_succeeded(item)]
          excluded_unscraped = max(len(items) - len(scraped_items), 0)
          llm_ready_items = [item for item in scraped_items if ready_for_llm_judge(item)]
          excluded_not_llm_ready = max(len(scraped_items) - len(llm_ready_items), 0)
          eligible_items = [
              item for item in llm_ready_items if str(item.get("ai_summary") or "").strip()
          ]
          excluded_missing_ai_summary = max(len(llm_ready_items) - len(eligible_items), 0)

          deduped_items = []
          seen_keys: set[str] = set()
          seen_ids: set[str] = set()
          duplicate_candidates = 0
          for item in eligible_items:
            key = item_key(item)
            if key and key in seen_keys:
              duplicate_candidates += 1
              continue
            if key:
              seen_keys.add(key)
            item_id = str(item.get("id") or "").strip()
            if item_id and item_id in seen_ids:
              duplicate_candidates += 1
              continue
            if item_id:
              seen_ids.add(item_id)
            deduped_items.append(item)

          pending_items = []
          fully_scored_skipped = 0
          partial_coverage_items = 0
          force_rescore = os.environ.get("FORCE_RESCORE", "false").strip().lower() == "true"
          for item in deduped_items:
            if force_rescore:
              pending_items.append(item)
              continue
            item_id = str(item.get("id") or "").strip()
            if not item_id:
              pending_items.append(item)
              continue

            if item_id not in scored_item_ids:
              pending_items.append(item)
              continue

            scored_rubrics = scored_rubric_signatures_by_item_id.get(item_id, set())
            has_full_coverage = bool(required_rubric_signatures) and required_rubric_signatures.issubset(
              scored_rubrics
            )
            if has_full_coverage:
              fully_scored_skipped += 1
              continue
            partial_coverage_items += 1
            pending_items.append(item)

          max_items_raw = os.environ.get("SCORE_MAX_ITEMS", "0").strip()
          try:
            max_items = int(max_items_raw)
          except ValueError:
            max_items = 0

          if max_items <= 0:
            selected = pending_items
          else:
            selected = pending_items[:max_items]

          score_payload = dict(payload) if isinstance(payload, dict) else {}
          score_payload["items"] = selected
          score_input_path.write_text(
            json.dumps(score_payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"items={len(selected)}\n")

          print(
            "Scoring subset items: "
            f"{len(selected)} selected / {len(pending_items)} pending / {len(deduped_items)} eligible / {len(items)} candidates "
            f"(excluded_unscraped={excluded_unscraped}, excluded_not_llm_ready={excluded_not_llm_ready}, excluded_missing_ai_summary={excluded_missing_ai_summary}, "
            f"duplicate_candidates={duplicate_candidates}, fully_scored_skipped={fully_scored_skipped}, partial_coverage_items={partial_coverage_items}, "
            f"required_rubrics={len(required_rubric_signatures)}, force_rescore={force_rescore}, "
            f"history_items={len(history_items)})"
          )
          PY

      - name: Run scoring precompute
        if: steps.score_subset.outputs.items != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FORCE_RESCORE: ${{ github.event.inputs.force_rescore || 'false' }}
        run: |
          score_cmd=(python3 -m rss_pipeline.cli score run \
            --experiment data/rss_openai_daily_for_scoring.json \
            --lenses lenses \
            --output data/scores.json \
            --temperature 0.0 \
            --cache-path data/cache/openai_cache.sqlite \
            --prompt-audit-dir data/analysis/prompt_audit)

          if [ "${FORCE_RESCORE}" = "true" ]; then
            score_cmd+=(--replace-output)
          fi

          "${score_cmd[@]}"

      - name: Run analysis precompute
        if: steps.score_subset.outputs.items != '0'
        run: |
          python3 -m rss_pipeline.cli analysis run \
            --scores data/scores.json \
            --lenses lenses \
            --output-root data/analysis \
            --source-permutations 1000 \
            --source-random-seed 42

      - name: Skip scoring/analysis
        if: steps.score_subset.outputs.items == '0'
        run: echo "Scoring/analysis skipped (disabled or no selected digest items)."

      - name: Build app-consumable precomputed JSON
        env:
          HISTORY_DAYS: "180"
        run: |
          set -euo pipefail

          publish_cmd=(python3 -m rss_pipeline.cli publish build \
            --digest data/rss_openai_daily.json \
            --scores data/scores.json \
            --analysis-root data/analysis \
            --output data/processed/rss_openai_precomputed.json \
            --history-dir data/history \
            --history-days "${HISTORY_DAYS}" \
            --include-history)

          "${publish_cmd[@]}"

      - name: Validate precomputed history contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path("data/processed/rss_openai_precomputed.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))

          digest = payload.get("digest")
          digest_obj = digest if isinstance(digest, dict) else {}

          include_history = digest_obj.get("include_history")
          history_days = digest_obj.get("history_days")

          errors: list[str] = []
          if include_history is not True:
              errors.append(f"digest.include_history expected true, found {include_history!r}")
          if history_days != 180:
              errors.append(f"digest.history_days expected 180, found {history_days!r}")

          summary = payload.get("summary")
          if isinstance(summary, dict):
              articles = summary.get("articles")
              digest_articles = summary.get("digest_articles")
              if isinstance(articles, int) and isinstance(digest_articles, int) and articles < digest_articles:
                  errors.append(
                      f"summary.articles ({articles}) must be >= summary.digest_articles ({digest_articles})"
                  )

          if errors:
              for error in errors:
                  print(error)
              sys.exit(1)

          print("History contract validated: include_history=true, history_days=180")
          PY

      - name: Upload processed JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-openai-precomputed
          path: data/processed/rss_openai_precomputed.json

      - name: Cache telemetry
        if: always()
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("data/cache/openai_cache.sqlite")
          if not db.exists():
              print("OpenAI cache DB does not exist for this run.")
              raise SystemExit(0)

          with sqlite3.connect(db) as conn:
              total_calls, hits, misses = conn.execute(
                  """
                  SELECT
                    COUNT(*) AS calls,
                    SUM(CASE WHEN cache_hit = 1 THEN 1 ELSE 0 END) AS hits,
                    SUM(CASE WHEN cache_hit = 0 THEN 1 ELSE 0 END) AS misses
                  FROM openai_calls
                  """
              ).fetchone()
              cached_rows, total_hit_count = conn.execute(
                  """
                  SELECT
                    COUNT(*) AS cache_rows,
                    SUM(hit_count) AS total_hit_count
                  FROM openai_cache
                  """
              ).fetchone()

          total_calls = int(total_calls or 0)
          hits = int(hits or 0)
          misses = int(misses or 0)
          cached_rows = int(cached_rows or 0)
          total_hit_count = int(total_hit_count or 0)
          hit_rate = (hits / total_calls * 100.0) if total_calls else 0.0

          print(f"OpenAI calls logged: {total_calls}")
          print(f"Cache hits/misses: {hits}/{misses} ({hit_rate:.1f}% hit rate)")
          print(f"Cached response rows: {cached_rows}")
          print(f"Lifetime cache retrievals: {total_hit_count}")
          PY

      - name: Save OpenAI cache DB
        if: always() && hashFiles('data/cache/openai_cache.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-openai-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save scoring artifacts
        if: always() && hashFiles('data/scores.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/scores.json
          key: ${{ runner.os }}-rss-score-artifacts-${{ github.ref_name }}-${{ github.run_id }}

      - name: Commit digest and processed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/rss_openai_daily.json \
            data/history/rss_openai_daily_*.json \
            data/analysis/quality/rss_digest_quality_review.json \
            data/analysis/quality/history/rss_digest_quality_review_*.json \
            data/analysis/feed_audit/rss_feed_audit.json \
            data/analysis/feed_audit/source_health_trends.json \
            data/analysis/feed_audit/history/rss_feed_audit_*.json \
            data/processed/rss_openai_precomputed.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RSS precomputed pipeline artifacts"
            git push
          fi
