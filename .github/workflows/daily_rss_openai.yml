name: Daily RSS OpenAI Digest

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Max enabled sources to scan"
        required: false
        default: "25"
      feeds_per_source:
        description: "Feeds per source to scan"
        required: false
        default: "2"
      max_items_per_feed:
        description: "RSS items per feed (increase for older coverage)"
        required: false
        default: "8"
      skip_seen:
        description: "Skip links/titles already present in current + history"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      source_ids:
        description: "Optional comma-separated source IDs (blank = all enabled)"
        required: false
        default: ""
      run_scoring:
        description: "Run rubric scoring + downstream analysis"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      score_max_items:
        description: "Max digest items to score (0 = all digest items)"
        required: false
        default: "40"
      include_history:
        description: "Include archived history items in processed JSON"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      history_days:
        description: "History window in days for processed JSON (0 = all history files)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily-rss-openai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-rss-openai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore OpenAI cache DB
        id: openai_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-openai-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openai-cache-${{ github.ref_name }}-
            ${{ runner.os }}-openai-cache-main-

      - name: Show cache restore details
        run: |
          echo "Cache primary key: ${{ steps.openai_cache_restore.outputs.cache-primary-key }}"
          echo "Cache matched key: ${{ steps.openai_cache_restore.outputs.cache-matched-key }}"
          echo "Cache exact hit: ${{ steps.openai_cache_restore.outputs.cache-hit }}"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run RSS OpenAI digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_SOURCES: ${{ github.event.inputs.max_sources || '25' }}
          FEEDS_PER_SOURCE: ${{ github.event.inputs.feeds_per_source || '2' }}
          MAX_ITEMS_PER_FEED: ${{ github.event.inputs.max_items_per_feed || '8' }}
          SKIP_SEEN: ${{ github.event.inputs.skip_seen || 'true' }}
          SOURCE_IDS: ${{ github.event.inputs.source_ids || '' }}
        run: |
          set -euo pipefail

          echo "Digest build params: max_sources=${MAX_SOURCES}, feeds_per_source=${FEEDS_PER_SOURCE}, max_items_per_feed=${MAX_ITEMS_PER_FEED}, skip_seen=${SKIP_SEEN}, source_ids=${SOURCE_IDS:-<all>}"

          digest_cmd=(python3 -m rss_pipeline.cli digest build \
            --output data/rss_openai_daily.json \
            --max-sources "${MAX_SOURCES}" \
            --feeds-per-source "${FEEDS_PER_SOURCE}" \
            --max-items-per-feed "${MAX_ITEMS_PER_FEED}" \
            --scrape-timeout-seconds 12 \
            --scrape-sleep-seconds 0.25 \
            --cache-path data/cache/openai_cache.sqlite \
            --prompt-audit-dir data/analysis/prompt_audit)

          if [ "${SKIP_SEEN}" = "true" ]; then
            digest_cmd+=(--skip-seen)
          else
            digest_cmd+=(--no-skip-seen)
          fi

          if [ -n "${SOURCE_IDS}" ]; then
            digest_cmd+=(--source-ids "${SOURCE_IDS}")
          fi

          "${digest_cmd[@]}"

      - name: Inspect digest item count
        id: digest_meta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          payload = json.loads(Path("data/rss_openai_daily.json").read_text(encoding="utf-8"))
          items = payload.get("items") if isinstance(payload, dict) else []
          count = len(items) if isinstance(items, list) else 0
          print(f"Digest items: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"items={count}\n")
          PY

      - name: Prepare scoring subset
        id: score_subset
        env:
          RUN_SCORING: ${{ github.event.inputs.run_scoring || 'true' }}
          SCORE_MAX_ITEMS: ${{ github.event.inputs.score_max_items || '40' }}
        run: |
          set -euo pipefail

          if [ "${RUN_SCORING}" != "true" ]; then
            echo "Scoring disabled for this run."
            echo "items=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          digest_path = Path("data/rss_openai_daily.json")
          score_input_path = Path("data/rss_openai_daily_for_scoring.json")
          payload = json.loads(digest_path.read_text(encoding="utf-8"))
          raw_items = payload.get("items") if isinstance(payload, dict) else []
          items = raw_items if isinstance(raw_items, list) else []

          max_items_raw = os.environ.get("SCORE_MAX_ITEMS", "40").strip()
          try:
            max_items = int(max_items_raw)
          except ValueError:
            max_items = 40

          if max_items <= 0:
            selected = items
          else:
            selected = items[:max_items]

          score_payload = dict(payload) if isinstance(payload, dict) else {}
          score_payload["items"] = selected
          score_input_path.write_text(
              json.dumps(score_payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"items={len(selected)}\n")

          print(f"Scoring subset items: {len(selected)} / {len(items)}")
          PY

      - name: Run scoring precompute
        if: steps.score_subset.outputs.items != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python3 -m rss_pipeline.cli score run \
            --experiment data/rss_openai_daily_for_scoring.json \
            --lenses lenses \
            --output data/scores.json \
            --high-scores-output data/high_scoring_articles.json \
            --cache-path data/cache/openai_cache.sqlite \
            --prompt-audit-dir data/analysis/prompt_audit \
            --replace-output

      - name: Run analysis precompute
        if: steps.score_subset.outputs.items != '0'
        run: |
          python3 -m rss_pipeline.cli analysis run \
            --scores data/scores.json \
            --lenses lenses \
            --output-root data/analysis \
            --source-permutations 1000 \
            --source-random-seed 42

      - name: Skip scoring/analysis
        if: steps.score_subset.outputs.items == '0'
        run: echo "Scoring/analysis skipped (disabled or no selected digest items)."

      - name: Build app-consumable precomputed JSON
        env:
          INCLUDE_HISTORY: ${{ github.event.inputs.include_history || 'true' }}
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '30' }}
        run: |
          set -euo pipefail

          publish_cmd=(python3 -m rss_pipeline.cli publish build \
            --digest data/rss_openai_daily.json \
            --scores data/scores.json \
            --high-scores data/high_scoring_articles.json \
            --analysis-root data/analysis \
            --output data/processed/rss_openai_precomputed.json \
            --history-dir data/history \
            --history-days "${HISTORY_DAYS}")

          if [ "${INCLUDE_HISTORY}" = "true" ]; then
            publish_cmd+=(--include-history)
          else
            publish_cmd+=(--no-include-history)
          fi

          "${publish_cmd[@]}"

      - name: Upload processed JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-openai-precomputed
          path: data/processed/rss_openai_precomputed.json

      - name: Cache telemetry
        if: always()
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("data/cache/openai_cache.sqlite")
          if not db.exists():
              print("OpenAI cache DB does not exist for this run.")
              raise SystemExit(0)

          with sqlite3.connect(db) as conn:
              total_calls, hits, misses = conn.execute(
                  """
                  SELECT
                    COUNT(*) AS calls,
                    SUM(CASE WHEN cache_hit = 1 THEN 1 ELSE 0 END) AS hits,
                    SUM(CASE WHEN cache_hit = 0 THEN 1 ELSE 0 END) AS misses
                  FROM openai_calls
                  """
              ).fetchone()
              cached_rows, total_hit_count = conn.execute(
                  """
                  SELECT
                    COUNT(*) AS cache_rows,
                    SUM(hit_count) AS total_hit_count
                  FROM openai_cache
                  """
              ).fetchone()

          total_calls = int(total_calls or 0)
          hits = int(hits or 0)
          misses = int(misses or 0)
          cached_rows = int(cached_rows or 0)
          total_hit_count = int(total_hit_count or 0)
          hit_rate = (hits / total_calls * 100.0) if total_calls else 0.0

          print(f"OpenAI calls logged: {total_calls}")
          print(f"Cache hits/misses: {hits}/{misses} ({hit_rate:.1f}% hit rate)")
          print(f"Cached response rows: {cached_rows}")
          print(f"Lifetime cache retrievals: {total_hit_count}")
          PY

      - name: Save OpenAI cache DB
        if: always() && hashFiles('data/cache/openai_cache.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-openai-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Commit digest and processed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/rss_openai_daily.json \
            data/history/rss_openai_daily_*.json \
            data/processed/rss_openai_precomputed.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RSS precomputed pipeline artifacts"
            git push
          fi
