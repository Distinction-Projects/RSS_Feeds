name: RSS Pipeline Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Loader self-test
        run: python3 load_experiment.py --self-test

      - name: Digest parse smoke
        run: python3 load_experiment.py data/rss_openai_daily.json

      - name: Syntax smoke
        run: |
          python3 -m py_compile \
            load_experiment.py \
            scrape_experiment_links.py \
            run_pre_openai.py \
            score_news_item.py \
            run_post_openai.py \
            build_lens_article_matrix.py \
            analyze_lens_scores.py \
            analysis_report.py \
            lens.py \
            analysis_module/__init__.py \
            analysis_module/core.py \
            analysis_module/explore.py
