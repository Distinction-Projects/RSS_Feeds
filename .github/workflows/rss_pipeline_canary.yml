name: RSS Pipeline Canary (No OpenAI)

on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      CANARY_OUTPUT: /tmp/rss_pipeline_canary_${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: CLI and tooling checks
        run: |
          python3 -m rss_pipeline.cli --help
          python3 -m rss_pipeline.cli digest --help
          python3 -m rss_pipeline.cli digest build --help
          python3 -m rss_pipeline.cli digest archive --help
          python3 -m rss_pipeline.cli newsdata --help
          python3 -m rss_pipeline.cli newsdata fetch --help
          python3 -m rss_pipeline.cli newsdata test --help
          python3 -m rss_pipeline.cli score --help
          python3 -m rss_pipeline.cli score run --help
          python3 -m rss_pipeline.cli analysis --help
          python3 -m rss_pipeline.cli analysis run --help
          python3 -m rss_pipeline.cli validate --help
          python3 -m rss_pipeline.cli validate all --help
          ruff check load_experiment.py lens.py serialization_utils.py rss_pipeline run_pre_openai.py run_post_openai.py score_news_item.py rss_openai_digest.py newsdata_client.py newsdata_test.py tests/test_serialization_contracts.py tests/test_cache_sqlite.py
          ruff format --check load_experiment.py lens.py serialization_utils.py rss_pipeline run_pre_openai.py run_post_openai.py score_news_item.py rss_openai_digest.py newsdata_client.py newsdata_test.py tests/test_serialization_contracts.py tests/test_cache_sqlite.py
          mypy

      - name: Offline validation
        run: python3 -m rss_pipeline.cli validate all

      - name: Pre-OpenAI canary (fixtures + snapshot)
        run: |
          python3 -m rss_pipeline.cli pre-openai --experiment tests/fixtures/canonical_digest.json
          python3 -m rss_pipeline.cli pre-openai --experiment data/rss_openai_daily.json

      - name: Post-OpenAI canary (fixture scores, no API)
        run: |
          python3 -m rss_pipeline.cli analysis run \
            --scores tests/fixtures/valid_scores.json \
            --lenses tests/fixtures/valid_lens.json \
            --output-root "$CANARY_OUTPUT" \
            --source-permutations 50 \
            --source-random-seed 42

      - name: Verify canary outputs
        run: |
          test -f "$CANARY_OUTPUT/matrix/lens_article_matrix.csv"
          test -f "$CANARY_OUTPUT/lens_stats/lens_summary.json"
          test -f "$CANARY_OUTPUT/report/source_differentiation_summary.json"
