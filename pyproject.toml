[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "data",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["analysis_module", "rss_pipeline"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_optional = true
ignore_missing_imports = true
files = [
  "load_experiment.py",
  "lens.py",
  "serialization_utils.py",
  "rss_pipeline",
  "run_pre_openai.py",
  "run_post_openai.py",
  "score_news_item.py",
  "rss_openai_digest.py",
  "newsdata_client.py",
  "newsdata_test.py",
  "tests/test_serialization_contracts.py",
  "tests/test_cache_sqlite.py",
]
